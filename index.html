<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AV女優クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="title">AV女優クイズ</h1>

    <!-- クイズ画面 -->
    <section id="quiz-screen">
      <p id="progress" class="progress"></p>
      <h2 id="question" class="question"></h2>
      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button id="next-button" class="button" hidden>次の問題へ</button>
    </section>

    <!-- 結果画面 -->
    <section id="result-screen" hidden>
      <h2 class="result-heading">結果</h2>
      <p id="score" class="score"></p>
      <p id="result-message" class="result-message"></p>
      <button id="retry-button" class="button">もう一度挑戦する</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
